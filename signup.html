<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth" data-theme="rose-noir">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height, viewport-fit=cover">
    <title>Create Account · Bridal Atelier — Luxury Wedding Styling</title>

    <link rel="icon" type="image/svg+xml" href="Assets/favicon.svg">

    <!-- Tailwind CSS -->
    <script src="tailwind.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'gift-slate': 'rgba(var(--color-rgb-primary), <alpha-value>)',
                        'gift-slate-light': 'rgba(var(--color-rgb-light), <alpha-value>)',
                        'gift-slate-dark': 'rgba(var(--color-rgb-dark), <alpha-value>)',
                        'gift-slate-bright': 'rgba(var(--color-rgb-bright), <alpha-value>)',
                        'gift-accent': 'rgba(var(--color-rgb-accent), <alpha-value>)',
                        'bg-warm': 'var(--color-bg-warm)',
                        'neutral-dark': 'rgba(30, 16, 20, <alpha-value>)',
                        'neutral-light': '#F5E6E9',
                        'dark-bg': '#140C0E',
                        'dark-card': '#201418',
                        'dark-surface': '#2C1D22',
                    },
                    fontFamily: {
                        'sans': ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        'serif': ['Cormorant Garamond', 'serif'],
                        'display': ['Cormorant Garamond', 'Outfit', 'serif'],
                        'premium': ['Cormorant Garamond', 'Outfit', 'serif'],
                        'alt': ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out',
                        'float-slow': 'floatSlow 6s ease-in-out infinite',
                        'slide-up': 'slideUp 0.5s ease-out',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0', transform: 'translateY(12px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        floatSlow: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-6px)' } },
                        slideUp: { '0%': { transform: 'translateY(30px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
                    }
                }
            }
        };
    </script>
    <script>
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
        if (localStorage.getItem('dir') === 'rtl') { document.documentElement.dir = 'rtl'; document.documentElement.lang = 'ar'; }
    </script>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        :root, [data-theme="rose-noir"] {
            --color-primary: #C2707E;
            --color-primary-light: #DE9DA9;
            --color-primary-dark: #8F3B4A;
            --color-primary-bright: #F5C6CE;
            --color-accent: #E2A676;
            --color-bg-warm: #FCF8F8;
            --color-text-dark: #1E1014;
            --color-rgb-primary: 194, 112, 126;
            --color-rgb-light: 222, 157, 169;
            --color-rgb-dark: 143, 59, 74;
            --color-rgb-bright: 245, 198, 206;
            --color-rgb-accent: 226, 166, 118;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--color-bg-warm);
            color: var(--color-text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .dark body {
            background-color: #140C0E;
            color: #EDE7E3;
        }

        .dark .text-neutral-dark { color: #EDE7E3; }
        .dark input, .dark select, .dark textarea { color: #FFFFFF !important; }

        .gold-gradient-text {
            background: linear-gradient(135deg, var(--color-primary-bright) 0%, var(--color-primary) 50%, var(--color-primary-dark) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Theme toggles — top-right */
        .theme-toggle-wrapper {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1000;
            display: flex;
            gap: 8px;
        }

        [dir="rtl"] .theme-toggle-wrapper {
            right: auto;
            left: 16px;
        }

        .toggle-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(var(--color-rgb-primary), 0.12);
            color: var(--color-primary);
            transition: all 0.3s ease;
            border: 1px solid rgba(var(--color-rgb-primary), 0.2);
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }

        .dark .toggle-btn {
            background: rgba(var(--color-rgb-bright), 0.12);
            color: var(--color-primary-bright);
            border-color: rgba(var(--color-rgb-bright), 0.2);
        }

        .toggle-btn:hover {
            transform: scale(1.08);
            background: var(--color-primary);
            color: #FFFFFF;
        }

        .dark .toggle-btn:hover {
            background: var(--color-primary-bright);
            color: #140C0E;
        }

        /* Signup Card */
        .signup-card {
            background: #FFFFFF;
            border-radius: 36px;
            padding: 1.8rem 2rem 1.8rem;
            box-shadow: 0 25px 50px rgba(var(--color-rgb-primary), 0.10);
            border: 1px solid rgba(var(--color-rgb-primary), 0.15);
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .dark .signup-card {
            background: #201418;
            border-color: rgba(var(--color-rgb-bright), 0.2);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        /* Input styling */
        .signup-input {
            width: 100%;
            padding: 0.8rem 1.2rem 0.8rem 3rem;
            border-radius: 50px;
            border: 1.5px solid rgba(var(--color-rgb-primary), 0.15);
            background: #FFFFFF;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            color: var(--color-text-dark);
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .dark .signup-input {
            background: #140C0E;
            border-color: rgba(var(--color-rgb-bright), 0.2);
            color: #EDE7E3;
        }

        .signup-input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 4px rgba(var(--color-rgb-primary), 0.15);
        }

        .dark .signup-input:focus {
            border-color: var(--color-primary-bright);
            box-shadow: 0 0 0 4px rgba(var(--color-rgb-bright), 0.12);
        }

        .signup-input::placeholder {
            color: rgba(30, 16, 20, 0.4);
        }
        .dark .signup-input::placeholder {
            color: rgba(237, 231, 227, 0.3);
        }

        /* Password wrapper */
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper .signup-input {
            padding-right: 3rem;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--color-primary);
            font-size: 0.95rem;
            transition: color 0.2s;
            background: transparent;
            border: none;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dark .toggle-password {
            color: var(--color-primary-bright);
        }

        .toggle-password:hover {
            color: var(--color-primary-dark);
        }

        [dir="rtl"] .toggle-password {
            right: auto;
            left: 1rem;
        }

        [dir="rtl"] .password-wrapper .signup-input {
            padding-right: 1.2rem;
            padding-left: 3rem;
        }

        [dir="rtl"] .input-icon {
            left: auto;
            right: 1.1rem;
        }

        /* Primary button */
        .btn-bridal {
            background: linear-gradient(135deg, var(--color-primary-light) 0%, var(--color-primary) 100%);
            color: #FFFFFF;
            font-weight: 700;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            font-family: 'Plus Jakarta Sans', sans-serif;
            box-shadow: 0 4px 15px rgba(var(--color-rgb-primary), 0.3);
        }

        .dark .btn-bridal {
            background: linear-gradient(135deg, var(--color-primary-bright) 0%, var(--color-primary) 100%);
            color: #140C0E;
            box-shadow: 0 4px 15px rgba(var(--color-rgb-bright), 0.3);
        }

        .btn-bridal:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(var(--color-rgb-primary), 0.4);
        }

        .dark .btn-bridal:hover {
            box-shadow: 0 10px 25px rgba(var(--color-rgb-bright), 0.4);
        }

        /* Social login buttons */
        .social-btn {
            flex: 1;
            padding: 0.7rem 0.5rem;
            border-radius: 50px;
            border: 1.5px solid rgba(var(--color-rgb-primary), 0.15);
            background: #FFFFFF;
            color: var(--color-text-dark);
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            gap: 0.5rem;
            white-space: nowrap;
            cursor: pointer;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .dark .social-btn {
            background: #140C0E;
            border-color: rgba(var(--color-rgb-bright), 0.2);
            color: #EDE7E3;
        }

        .social-btn:hover {
            background: var(--color-bg-warm);
            border-color: var(--color-primary);
            transform: translateY(-2px);
        }

        .dark .social-btn:hover {
            background: rgba(var(--color-rgb-bright), 0.08);
            border-color: var(--color-primary-bright);
        }

        .social-btn i {
            font-size: 1.1rem;
            color: var(--color-primary);
        }

        .dark .social-btn i {
            color: var(--color-primary-bright);
        }

        /* Logo container */
        .logo-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .brand-logo {
            background: linear-gradient(135deg, var(--color-primary-light), var(--color-primary));
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(var(--color-rgb-primary), 0.25);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .brand-logo:hover {
            transform: scale(1.05) rotate(-3deg);
        }

        .dark .brand-logo {
            background: linear-gradient(135deg, var(--color-primary-bright), var(--color-primary));
        }

        .brand-logo i {
            font-size: 1.3rem;
            color: #FFFFFF;
        }

        .dark .brand-logo i {
            color: #140C0E;
        }

        .welcome-title {
            font-family: 'Cormorant Garamond', 'Outfit', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--color-text-dark);
            margin-top: 1.25rem;
            margin-bottom: 0.1rem;
            text-align: center;
            line-height: 1.1;
            letter-spacing: -0.015em;
        }

        .dark .welcome-title {
            color: #EDE7E3;
        }

        .welcome-subtitle {
            font-size: 0.85rem;
            color: var(--color-text-dark);
            text-align: center;
            margin-bottom: 0.25rem;
            font-weight: 400;
            opacity: 0.7;
        }

        .dark .welcome-subtitle {
            color: #EDE7E3;
        }

        /* Decorative serif flourish under title */
        .flourish-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin: 0.7rem 0 0.25rem;
            color: var(--color-primary);
            opacity: 0.55;
        }

        .dark .flourish-divider {
            color: var(--color-primary-bright);
        }

        .flourish-divider .line {
            width: 28px;
            height: 1px;
            background: currentColor;
        }

        .flourish-divider i {
            font-size: 0.55rem;
        }

        /* Terms text */
        .terms-text {
            font-size: 0.7rem;
            color: var(--color-text-dark);
        }

        .dark .terms-text {
            color: #D6CEC8;
        }

        .terms-link {
            color: var(--color-primary);
            font-weight: 600;
            text-decoration: none;
        }

        .dark .terms-link {
            color: var(--color-primary-bright);
        }

        .terms-link:hover {
            text-decoration: underline;
            color: var(--color-primary-dark);
        }

        .dark .terms-link:hover {
            color: var(--color-primary-light);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1rem 0 0.8rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(var(--color-rgb-primary), 0.15);
        }

        .dark .divider::before,
        .dark .divider::after {
            border-bottom-color: rgba(var(--color-rgb-bright), 0.2);
        }

        .divider span {
            font-size: 0.7rem;
            padding: 0 0.8rem;
            color: var(--color-text-dark);
            font-weight: 600;
            opacity: 0.6;
        }

        .dark .divider span {
            color: #D6CEC8;
        }

        .custom-checkbox {
            accent-color: var(--color-primary);
        }

        .dark .custom-checkbox {
            accent-color: var(--color-primary-bright);
        }

        a {
            transition: all 0.2s ease;
        }

        /* Background decorative glow */
        .bg-glow {
            position: fixed;
            top: -30%;
            right: -20%;
            width: 60%;
            height: 80%;
            background: radial-gradient(circle, rgba(var(--color-rgb-primary), 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .dark .bg-glow {
            background: radial-gradient(circle, rgba(var(--color-rgb-bright), 0.05) 0%, transparent 70%);
        }

        .bg-glow-left {
            position: fixed;
            bottom: -30%;
            left: -20%;
            width: 60%;
            height: 80%;
            background: radial-gradient(circle, rgba(var(--color-rgb-primary), 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .dark .bg-glow-left {
            background: radial-gradient(circle, rgba(var(--color-rgb-bright), 0.04) 0%, transparent 70%);
        }

        .container-tight {
            max-width: 480px;
            width: 100%;
            padding: 0 1.5rem;
        }

        /* Responsive */
        @media (max-height: 650px) {
            .signup-card { padding: 0.8rem 1.5rem; transform: scale(0.94); transform-origin: center; }
            .logo-center { margin-bottom: 0.3rem; }
            .welcome-title { font-size: 1.4rem; margin-top: 0.25rem; }
            .welcome-subtitle { font-size: 0.75rem; margin-bottom: 0.15rem; }
            .signup-input { padding: 0.5rem 0.8rem 0.5rem 2.5rem; font-size: 0.8rem; }
            .btn-bridal { padding: 0.5rem 1rem; font-size: 0.85rem; }
            .brand-logo { width: 36px; height: 36px; }
            .brand-logo i { font-size: 1.05rem; }
            .theme-toggle-wrapper { top: 8px; right: 8px; }
            .toggle-btn { width: 34px; height: 34px; font-size: 0.8rem; }
            .divider { margin: 0.6rem 0; }
            .social-btn { padding: 0.4rem 0.5rem; font-size: 0.75rem; }
            .flourish-divider { margin: 0.4rem 0 0; }
        }

        @media (max-width: 380px) {
            .signup-card { padding: 1.2rem 1.2rem; border-radius: 24px; }
            .welcome-title { font-size: 1.5rem; }
            .signup-input { padding: 0.6rem 0.8rem 0.6rem 2.6rem; font-size: 0.8rem; }
            .social-btn { padding: 0.4rem 0.3rem; font-size: 0.75rem; gap: 0.3rem; }
            .social-btn i { font-size: 0.9rem; }
        }

        @media (max-width: 480px) {
            .theme-toggle-wrapper { top: 12px; right: 12px; }
            [dir="rtl"] .theme-toggle-wrapper { left: 12px; right: auto; }
        }
    </style>
</head>

<body>

    <!-- Background Glows -->
    <div class="bg-glow"></div>
    <div class="bg-glow-left"></div>

    <!-- ===== THEME TOGGLES - TOP-RIGHT ===== -->
    <div class="theme-toggle-wrapper">
        <button id="theme-toggle" class="toggle-btn" title="Dark / Light">
            <i class="fas fa-moon dark:hidden"></i>
            <i class="fas fa-sun hidden dark:inline"></i>
        </button>
        <button id="rtl-toggle" class="toggle-btn" title="RTL / LTR">
            ⇄
        </button>
    </div>

    <!-- ===== SIGNUP CARD ===== -->
    <div class="container-tight relative z-10">
        <div class="signup-card animate-fade-in">

            <!-- ===== LOGO - CENTERED ===== -->
            <div class="logo-center">
                <a href="index.html" class="flex items-center gap-3 group shrink-0" dir="ltr">
                    <div class="brand-logo group-hover:rotate-6 transition duration-300">
                        <i class="fas fa-gem"></i>
                    </div>
                    <div>
                        <span class="text-2xl font-serif font-bold tracking-wide text-neutral-dark dark:text-white">
                            Bridal <span class="gold-gradient-text">Atelier</span>
                        </span>
                    </div>
                </a>

                <h1 class="welcome-title">Create Your Account</h1>

                <div class="flourish-divider">
                    <span class="line"></span>
                    <i class="fas fa-heart"></i>
                    <span class="line"></span>
                </div>

                <p class="welcome-subtitle">Begin your bridal beauty journey with us</p>
            </div>

            <!-- ===== SIGNUP FORM ===== -->
            <form id="signupForm" class="space-y-3.5" action="client.html" method="GET">

                <!-- Full Name -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gift-slate input-icon">
                        <i class="fas fa-user w-4 text-sm"></i>
                    </span>
                    <input type="text" id="fullName" name="name" placeholder="Full name" required
                        class="signup-input text-sm md:text-sm">
                </div>

                <!-- Email -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gift-slate input-icon">
                        <i class="fas fa-envelope w-4 text-sm"></i>
                    </span>
                    <input type="email" id="email" name="email" placeholder="Email address" required
                        class="signup-input text-sm md:text-sm">
                </div>

                <!-- Password with eye -->
                <div class="password-wrapper">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gift-slate input-icon">
                        <i class="fas fa-lock w-4 text-sm"></i>
                    </span>
                    <input type="password" id="signup-password" name="password" placeholder="Password" required
                        class="signup-input text-sm md:text-sm">
                    <button type="button" class="toggle-password" data-target="signup-password"
                        aria-label="Show password">
                        <i class="far fa-eye-slash"></i>
                    </button>
                </div>

                <!-- Confirm Password with eye -->
                <div class="password-wrapper">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gift-slate input-icon">
                        <i class="fas fa-lock w-4 text-sm"></i>
                    </span>
                    <input type="password" id="signup-confirm-password" name="confirm_password"
                        placeholder="Confirm password" required class="signup-input text-sm md:text-sm">
                    <button type="button" class="toggle-password" data-target="signup-confirm-password"
                        aria-label="Show password">
                        <i class="far fa-eye-slash"></i>
                    </button>
                </div>

               

                <!-- Terms -->
                <div class="flex items-start space-x-2 rtl:space-x-reverse mt-1">
                    <input type="checkbox" id="terms"
                        class="mt-0.5 rounded border-gray-300 dark:border-gray-600 custom-checkbox"
                        required>
                    <label for="terms" class="terms-text">
                        I agree <a href="#" class="terms-link" id="termsLink">Terms of Service</a> and
                        <a href="#" class="terms-link" id="privacyLink">Privacy Policy</a>
                    </label>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn-bridal mt-1">
                    Create Account <i class="fas fa-user-plus ml-2"></i>
                </button>
            </form>

            <!-- ===== Divider + Social ===== -->
            <div class="divider">
                <span>or sign up with</span>
            </div>

            <div class="flex gap-3">
                <button class="social-btn" id="googleSignupBtn">
                    <i class="fab fa-google"></i>
                    <span>Google</span>
                </button>
                <button class="social-btn" id="appleSignupBtn">
                    <i class="fab fa-apple"></i>
                    <span>Apple</span>
                </button>
            </div>

            <!-- ===== LOGIN LINK ===== -->
            <div class="mt-4 text-center">
                <span class="text-xs text-neutral-dark/60 dark:text-gray-400">Already a Bridal Atelier bride?</span>
                <a href="login.html"
                    class="text-xs font-semibold text-gift-slate dark:text-gift-slate-bright ml-1 rtl:mr-1 hover:underline">
                    Sign in
                </a>
            </div>

        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Theme Toggle
            const themeBtn = document.getElementById('theme-toggle');
            function setTheme(isDark) {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                document.documentElement.setAttribute('data-theme', 'rose-noir');
                const moon = themeBtn?.querySelector('.fa-moon');
                const sun = themeBtn?.querySelector('.fa-sun');
                if (isDark) { moon?.classList.add('hidden'); sun?.classList.remove('hidden'); }
                else { moon?.classList.remove('hidden'); sun?.classList.add('hidden'); }
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            }

            if (themeBtn) {
                themeBtn.addEventListener('click', () => {
                    setTheme(!document.documentElement.classList.contains('dark'));
                });
            }

            const savedTheme = localStorage.getItem('theme');
            setTheme(savedTheme === 'dark');

            // 2. RTL Toggle
            const rtlBtn = document.getElementById('rtl-toggle');
            function setRTL(isRTL) {
                document.documentElement.setAttribute('dir', isRTL ? 'rtl' : 'ltr');
                document.documentElement.setAttribute('lang', isRTL ? 'ar' : 'en');
                localStorage.setItem('dir', isRTL ? 'rtl' : 'ltr');
            }

            const savedDir = localStorage.getItem('dir');
            setRTL(savedDir === 'rtl');

            if (rtlBtn) {
                rtlBtn.addEventListener('click', () => {
                    setRTL(document.documentElement.getAttribute('dir') !== 'rtl');
                });
            }

            // 3. Password Toggle
            document.querySelectorAll('.toggle-password').forEach(button => {
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('data-target');
                    const input = document.getElementById(targetId);
                    if (input) {
                        const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                        input.setAttribute('type', type);
                        const icon = this.querySelector('i');
                        if (icon) {
                            icon.classList.toggle('fa-eye-slash');
                            icon.classList.toggle('fa-eye');
                        }
                    }
                });
            });

            // 4. Social signup placeholder
            document.getElementById('googleSignupBtn').addEventListener('click', function() {
                alert('Sign up with Google — coming soon. For now, use the demo form.');
            });
            document.getElementById('appleSignupBtn').addEventListener('click', function() {
                alert('Sign up with Apple — coming soon. For now, use the demo form.');
            });

            // 5. Demo signup — validate & redirect to login
            document.getElementById('signupForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const password = document.getElementById('signup-password').value;
                const confirm = document.getElementById('signup-confirm-password').value;
                if (password !== confirm) {
                    alert('Passwords do not match. Please try again.');
                    return;
                }
                if (!document.getElementById('terms').checked) {
                    alert('Please agree to the Terms of Service and Privacy Policy.');
                    return;
                }
                window.location.href = 'login.html';
            });

            // 6. Terms & Privacy links
            document.getElementById('termsLink').addEventListener('click', function(e) {
                e.preventDefault();
                alert('Terms of Service — coming soon.');
            });
            document.getElementById('privacyLink').addEventListener('click', function(e) {
                e.preventDefault();
                alert('Privacy Policy — coming soon.');
            });
        });
    </script>

</body>
</html>
