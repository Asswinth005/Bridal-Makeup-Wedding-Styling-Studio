<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <defs>
        <linearGradient id="bridalRose" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E29DAA" />
            <stop offset="50%" stop-color="#C2707E" />
            <stop offset="100%" stop-color="#A54F5E" />
        </linearGradient>
        <linearGradient id="facetShine" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
            <stop offset="100%" stop-color="#FCE5E9" stop-opacity="0.75" />
        </linearGradient>
    </defs>

    <!-- Luxury Squircle Badge matching Header Logo -->
    <rect width="64" height="64" rx="18" fill="url(#bridalRose)" />

    <!-- Subtle Inner Border -->
    <rect x="1.5" y="1.5" width="61" height="61" rx="16.5" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" fill="none" />

    <!-- Bridal Solitaire Gem Facets -->
    <!-- Top Table Facet -->
    <polygon points="23,17 41,17 37,27 27,27" fill="#FFFFFF" fill-opacity="0.95" />
    
    <!-- Left Crown Facet -->
    <polygon points="19,17 23,17 27,27 13,27" fill="#FFFFFF" fill-opacity="0.8" />
    
    <!-- Right Crown Facet -->
    <polygon points="41,17 45,17 51,27 37,27" fill="#FFFFFF" fill-opacity="0.85" />
    
    <!-- Center Pavilion (Bottom) -->
    <polygon points="27,27 37,27 32,47" fill="#FFFFFF" fill-opacity="0.98" />
    
    <!-- Left Pavilion Facet -->
    <polygon points="13,27 27,27 32,47" fill="#FFFFFF" fill-opacity="0.78" />
    
    <!-- Right Pavilion Facet -->
    <polygon points="37,27 51,27 32,47" fill="#FFFFFF" fill-opacity="0.82" />

    <!-- Bridal Radiance Sparkle at Top Right -->
    <path d="M48,11 Q48,16 53,16 Q48,16 48,21 Q48,16 43,16 Q48,16 48,11 Z" fill="#FFFFFF" />
</svg>
